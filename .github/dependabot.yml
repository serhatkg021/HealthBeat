# Haftalık bağımlılık güncellemeleri. Küçük ve yama sürümleri ekosistem başına tek PR'da toplanır; ana sürüm atlayanlar
# ayrı PR olarak gelir (GitHub Actions'ta onlar da gruplu). Dependabot PR'ları doğrudan birleştirilmez: aynı güncelleme
# Türkçe başlıklı ve CHANGELOG maddeli kendi PR'ımızla yapılır, Dependabot'unki kapanır (CONTRIBUTING.md §3).
# Agent'ın dış Go bağımlılığı yok, bu yüzden izlenmiyor.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: "Server"
    groups:
      server-go:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /server/panel
    schedule:
      interval: weekly
    commit-message:
      prefix: "Panel"
    groups:
      panel-npm:
        update-types: [minor, patch]
    ignore:
      # Tipler panelin derlendiği Node LTS sürümüyle eşleşik tutulur; ana sürümü Node geçişiyle birlikte elle değişir.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker # server, panel ve certs-init imajlarının taban imajları
    directories: [/server, /server/panel, /deploy/certs-init]
    schedule:
      interval: weekly
    commit-message:
      prefix: "Server"
    ignore:
      # Node ana sürümleri LTS takvimine göre elle geçilir (tek sayılı ve henüz LTS olmayan sürümler önerilmesin).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Go sürümü server/go.mod ile birlikte elle yükseltilir; imaj tek başına ileri gitmemeli.
      - dependency-name: "golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "CI"
    groups:
      actions:
        update-types: [major, minor, patch]
