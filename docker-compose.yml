# HealthBeat: PostgreSQL + API server + panel (nginx), tek komutla.
#
#   ./deploy/init-env.sh        # .env üretir (rastgele sırlar); bir kez
#   docker compose up -d --build
#   → panel:  https://localhost      API (agent'lar): https://localhost:8443
#
# İmajlar iki şekilde gelir (docs/DISTRIBUTION.md, "Server dağıtımı"):
#   yerelde derlenmiş  →  docker compose up -d --build           (HB_REGISTRY/HB_VERSION boş: healthbeat/...:local)
#   yayınlanmış sürüm  →  HB_REGISTRY=ghcr.io/<sahip> HB_VERSION=X.Y.Z docker compose pull && \
#                         HB_REGISTRY=ghcr.io/<sahip> HB_VERSION=X.Y.Z docker compose up -d   # X.Y.Z = server + panel sürümü (server/vX.Y.Z), agent'tan bağımsız
#   (aynı değerleri .env'ye yazarsan komutlara gerekmez)
#
# Kalıcı veriler adlandırılmış volume'lerdedir; `docker compose down` / `up` onları SİLMEZ:
#   pgdata  PostgreSQL veri dizini (tüm kullanıcılar, sunucular, metrikler, alert'ler)
#   certs   server VE panelin okuduğu TLS sertifikası (cert.pem, key.pem) ve isteğe bağlı CA (ca.pem) —
#           ikisi de aynı domain'i aynı sertifikayla, farklı porttan (443/8443) sunar.
#   logs    server'ın kalıcı log dosyaları (LOG_FILE: günlük dosyalar, son 14 gün).
# Volume'leri silmek yalnızca `docker compose down -v` (ya da `docker volume rm`) ile olur.
# Ayrıntı ve yedekleme: docs/DEPLOYMENT.md, "Docker Compose".

name: healthbeat

# Docker'ın kendi log kopyası (`docker compose logs`): varsayılan json-file sürücüsü onu hiç döndürmez ve disk dolabilir.
# Servis başına en fazla HB_DOCKER_LOG_MAX_FILE × HB_DOCKER_LOG_MAX_SIZE (varsayılan 3 × 10 MB, eskiler gzip'li) tutulur.
# Bu kopya canlı akış ve son olaylar içindir, container yeniden oluşturulunca sıfırlanır; server'ın kalıcı geçmişi `logs`
# volume'ündeki dosyalardadır (LOG_FILE).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${HB_DOCKER_LOG_MAX_SIZE:-10m}
    max-file: "${HB_DOCKER_LOG_MAX_FILE:-3}"
    compress: "true"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthbeat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli — ./deploy/init-env.sh çalıştır}
      POSTGRES_DB: ${POSTGRES_DB:-healthbeat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    # Dışarıdan (psql, yedek aracı) erişmek istersen yalnızca yerel arayüze aç:
    # ports:
    #   - "127.0.0.1:5432:5432"

  # Tek seferlik: /certs volume'ünde sertifika yoksa kendinden imzalı bir çift yazar. Bu çift hem server'ın
  # (agent'lara, :8443) hem panelin (tarayıcıya, :443) sunduğu TEK sertifikadır — ikisi de aynı domain'de
  # olduğu için (bkz. HB_TLS_HOSTS) ayrı sertifikaya gerek yok.
  certs-init:
    image: ${HB_REGISTRY:-healthbeat}/healthbeat-certs-init:${HB_VERSION:-local}
    build: ./deploy/certs-init
    environment:
      HB_TLS_HOSTS: ${HB_TLS_HOSTS:-localhost,server}
    volumes:
      - certs:/certs
    restart: "no"

  server:
    image: ${HB_REGISTRY:-healthbeat}/healthbeat-server:${HB_VERSION:-local}
    build: ./server
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      certs-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-healthbeat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-healthbeat}?sslmode=disable
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET gerekli}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET gerekli}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?SECRETS_ENCRYPTION_KEY gerekli}
      # İlk süper admin (yalnızca hiç süper admin yokken uygulanır; ilk girişten sonra .env'den silinebilir).
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Boş bırakılanlar server'ın varsayılanını kullanır.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Panel /api/'yi server'a proxy'ler; server gerçek istemci IP'sini (hız sınırları, denetim kaydı) yalnızca
      # panel container'ından gelen X-Forwarded-For'dan okur. Docker adı periyodik çözülür (container IP'si değişebilir).
      # Panel proxy'lemiyorsa (API_PROXY_URL boş) zararsızdır; kapatmak için .env'de TRUSTED_PROXIES= (boş).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES-panel}
      PULL_CA_CERT_FILE: ${PULL_CA_CERT_FILE:-}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-}
      LATEST_AGENT_VERSION: ${LATEST_AGENT_VERSION:-}
      MIN_SUPPORTED_AGENT_VERSION: ${MIN_SUPPORTED_AGENT_VERSION:-}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-}
      RATE_LIMIT_AUTH_FAILURES_PER_MINUTE: ${RATE_LIMIT_AUTH_FAILURES_PER_MINUTE:-}
      RATE_LIMIT_INGEST_PER_MINUTE: ${RATE_LIMIT_INGEST_PER_MINUTE:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      LOG_ERROR_BODY_BYTES: ${LOG_ERROR_BODY_BYTES:-}
      # Kalıcı log: `logs` volume'ünde günlük dosyalar (down ve güncellemelerden sonra kalır; yalnızca `down -v` siler).
      # Kapatmak için .env'de LOG_FILE= (boş).
      LOG_FILE: ${LOG_FILE-/var/log/healthbeat/server.log}
      LOG_FILE_MAX_AGE_DAYS: ${LOG_FILE_MAX_AGE_DAYS:-}
      LOG_FILE_MAX_TOTAL_MB: ${LOG_FILE_MAX_TOTAL_MB:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # E-posta ile şifre sıfırlama için SMTP_* ile birlikte gerekli: kullanıcının tarayıcıda gördüğü panel adresi.
      PANEL_BASE_URL: ${PANEL_BASE_URL:-}
    volumes:
      # Server bu dizinden yalnızca OKUR (sertifika + CA); değişiklikler yeniden başlatmadan algılanır.
      - certs:/certs:ro
      # Kalıcı server logu (LOG_FILE). Hostta bir klasörde görmek için: ./logs:/var/log/healthbeat (bkz. docs/DEPLOYMENT.md).
      - logs:/var/log/healthbeat
    ports:
      # Push agent'lar buraya bağlanır; pull agent'lar ise server'dan onlara gider.
      - "${HB_API_BIND:-0.0.0.0}:${HB_API_PORT:-8443}:8443"
    stop_grace_period: 20s # bekleyen alert e-postaları kapanırken (en çok 10 sn) boşaltılır

  panel:
    image: ${HB_REGISTRY:-healthbeat}/healthbeat-panel:${HB_VERSION:-local}
    build: ./server/panel
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      server:
        condition: service_healthy
    environment:
      # Panel API'yi kendi origin'i üzerinden (/api/) kullanır: CORS ve sertifika onayı gerekmez.
      # Panel ile API'yi ayrı alan adlarında sunacaksan API_PROXY_URL'i boşaltıp API_BASE_URL ver.
      API_BASE_URL: ${API_BASE_URL:-}
      API_PROXY_URL: ${API_PROXY_URL-https://server:8443}
    volumes:
      # Server'la AYNI sertifika: panel TLS'i kendisi sonlandırır, dosyaları yalnızca okur.
      - certs:/certs:ro
    ports:
      - "${HB_PANEL_BIND:-0.0.0.0}:${HB_PANEL_PORT:-443}:8443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1:8443/"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Yalnızca geliştirme/deneme için yakalayıcı SMTP: `docker compose --profile mail up -d`. Gönderilen e-postalar
  # gerçekten iletilmez; http://localhost:8025 adresindeki gelen kutusunda görünür. Kullanmak için .env'de
  # SMTP_HOST=mailpit, SMTP_PORT=1025, SMTP_FROM=healthbeat@localhost ve PANEL_BASE_URL=https://localhost ayarla.
  mailpit:
    image: axllent/mailpit:v1.21.8
    profiles: ["mail"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8025:8025" # gelen kutusu arayüzü yalnızca bu makineden erişilir; SMTP (1025) yalnızca ağ içinde

volumes:
  pgdata:
  certs:
  logs:
